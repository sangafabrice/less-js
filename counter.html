<style>
  @property --count {
    syntax: "<integer>";
    initial-value: 0;
    inherits: true;
  }

  @keyframes count {
    to {
      --count: 9;
    }
  }

  h1 {
    animation: count 2s linear infinite alternate;

    &::after {
      counter-reset: n var(--count);
      content: counter(n);
      font-size: 10rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 {
      animation: none;

      &::after {
        content: attr(aria-label);
      }
    }
  }
</style>

<style>
  dialog {
    --pace: 600ms ease;
    transition: transform var(--pace), opacity var(--pace);

    body:has(&:not(:modal))::before,
    &::backdrop {
      background-color: rgba(from black r g b / 0.6);
      backdrop-filter: blur(4px);
    }

    &[open] {
      opacity: 1;
      transform: translateY(0);

      @starting-style {
        opacity: 0;
        transform: translateY(-25vh);
      }

      &:not(:modal) {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);

        @starting-style {
          transform: translateY(-25vh);
        }

        body:has(&)::before {
          content: '';
          position: fixed;
          inset: 0;
          cursor: pointer;
        }
      }
    }

    &:focus-within {
      background-color: gray;
    }
  }

  body {
    text-align: center;
  }
</style>

<style>
  button {
    padding: 10px 16px;
    box-shadow: 0px 5px 0 black;
    border: 2px solid black;
    border-radius: 6px;
    background-color: green;
    transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 600;
    cursor: pointer;
    color: white;

    &:hover {
      box-shadow: 0 0 black;
      transform: translateY(6px);
    }

    &::before {
      content: attr(data-role);
    }

    form>& {
      background-color: red;
    }
  }
</style>

<body>
  <button>Open Dialog</button>
  <button>Open Modal</button>

  <dialog id="dialog">
    <h1 aria-label="9"></h1>
    <form method="dialog">
      <button>Close</button>
    </form>
  </dialog>
</body>

<script>
(function (body) {
  const dialogBtn = body.firstElementChild;
  const modalBtn = dialogBtn.nextElementSibling;
  
  body.onclick = function () {
    switch (event.target) {
      case this:
        dialog.close();
        break;
      case dialogBtn:
        dialog.show();
        break;
      case modalBtn:
        dialog.showModal();
        break;
    }
  }
})(document.body);
</script>
